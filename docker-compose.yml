services:
  postgresql:
    image: postgres:15-alpine
    container_name: hotel-orchestrator-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hotel-orchestrator-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: hotel-orchestrator-temporal
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/config/dynamicconfig/local.yaml
    volumes:
      - ./temporal-dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/local.yaml:ro
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "workflow", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal-ui:
    image: temporalio/ui:2.31.2
    container_name: hotel-orchestrator-temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"

  app:
    build: .
    container_name: hotel-orchestrator-app
    command: ["node", "dist/server.js"]
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    env_file:
      - .env.docker
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  worker:
    build: .
    container_name: hotel-orchestrator-worker
    command: ["node", "dist/temporal/worker.js"]
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
      app:
        condition: service_started
    env_file:
      - .env.docker
    restart: unless-stopped

volumes:
  postgres-data:
